<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Index of /fluid</title>
<meta name="description" content="2D fluid simulations.">
<style>
:root {
  --bg: #f7f6f3;
  --ink: #1c1b18;
  --dim: #8a8577;
  --rule: #dcd8cc;
  --accent: #a4552a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171614;
    --ink: #e8e4da;
    --dim: #7d7869;
    --rule: #2e2c27;
    --accent: #d98a56;
  }
}
* { margin: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  padding: clamp(2rem, 8vw, 6rem) clamp(1.25rem, 6vw, 4rem);
  max-width: 44rem;
}
h1 {
  font-size: clamp(1.4rem, 4vw, 1.9rem);
  font-weight: 500;
  letter-spacing: -0.02em;
}
h1 .slash { color: var(--accent); }
.sub {
  color: var(--dim);
  margin-top: 0.35rem;
  font-size: 0.85rem;
}
ul {
  list-style: none;
  margin-top: 3rem;
  border-top: 1px solid var(--rule);
}
li { border-bottom: 1px solid var(--rule); }
li a {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 0.25rem 1.5rem;
  align-items: baseline;
  padding: 1.1rem 0.25rem;
  text-decoration: none;
  color: inherit;
}
li a:hover .name, li a:focus-visible .name { color: var(--accent); }
li a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.name { font-weight: 600; }
.date { color: var(--dim); font-size: 0.8rem; }
.desc {
  grid-column: 1 / -1;
  color: var(--dim);
  font-size: 0.85rem;
}
footer {
  margin-top: 3rem;
  color: var(--dim);
  font-size: 0.75rem;
}
footer a { color: var(--dim); }
footer a:hover { color: var(--accent); }
</style>
</head>
<body>

<h1><span class="slash">/</span> fluid</h1>
<p class="sub">2D fluid simulations</p>

<ul>
  <li>
    <a href="simulation.html">
      <span class="name">simulation</span>
      <span class="date">2026</span>
      <span class="desc">High-resolution realtime 2D fluid simulation — paint velocity and dye with the pointer.</span>
    </a>
  </li>
  <li>
    <a href="species.html">
      <span class="name">species</span>
      <span class="date">2026</span>
      <span class="desc">Multi-species mass-conserving fluid simulation.</span>
    </a>
  </li>
</ul>

<footer><a href="../">← index of projects</a></footer>

</body>
</html>
