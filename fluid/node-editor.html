<!doctype html>
<html>
    <head>
        <title>Node Editor Test</title>
        <style>
            body {
                margin: 0;
                background: #1a1a1a;
            }
            #canvas {
                width: 100vw;
                height: 100vh;
                display: block;
                background: #252525;
            }

            .node_canvas {
                position: absolute;
                z-index: 1;
                border-radius: 10px;
            }

            .port {
                fill: #303030;
                stroke: #ffffff;
                stroke-width: 2;
                cursor: crosshair;
            }
            .port:hover {
                fill: #4a9eff;
            }
            .port-label {
                fill: #ffffff;
                font-size: 12px;
                font-family: Arial, sans-serif;
                text-anchor: middle;
            }

            .node-bg {
                cursor: grab;
                fill: #333;
                stroke: #555;
                stroke-width: 2;
            }
            .node-bg:hover {
                cursor: grab;
                stroke: #4a9eff;
                stroke-width: 2;
                transition: stroke-width 0.2s ease-in-out;
            }
            .node-header {
                fill: #2a2a2a;
            }
            .node-title {
                fill: #ffffff;
                font-size: 14px;
                font-family: Arial, sans-serif;
                text-anchor: middle;
            }

            .path {
                fill: none;
                stroke: #00ee00;
                stroke-width: 2px;
            }
            .path:hover {
                stroke-width: 4px;
                transition: stroke-width 0.2s ease-in-out;
            }
            .menu-item {
                cursor: pointer;
            }

            .menu-item:hover .menu-item-bg {
                fill: #3a3a3a !important;
            }

            .menu-item:active .menu-item-bg {
                fill: #0e639c !important;
            }
            .view-node-output {
                fill: #ffffff;
                stroke: #000000;
                stroke-width: 1;
                transition: fill 0.2s ease-in-out;
            }
        </style>
    </head>
    <body>
        <svg id="canvas"></svg>

        <script type="module" src="./NodeEditor/editor.js"></script>

        <script type="module">
            import { SVGRenderer } from "./NodeEditor/svgrenderer.js";
            import { PORT_DIR } from "./NodeEditor/common.js";
            import {
                NodeEditor,
                Node,
                TimeNode,
                Connection,
            } from "./NodeEditor/editor.js";

            // Test the Graph
            const nodeEditor = new NodeEditor(
                document.getElementById("canvas"),
            );

            const node1 = new Node("Node 1", 100, 100);
            const node2 = new Node("Node 2", 300, 100);
            const node3 = new TimeNode(500, 100);

            node1.setInputs([{ y_offset: 25 }, { y_offset: 50 }]);
            node2.setInputs([{ y_offset: 25 }, { y_offset: 50 }]);

            node1.setOutputs([{ y_offset: 25 }]);
            node2.setOutputs([{ y_offset: 25 }, { y_offset: 50 }]);

            nodeEditor.addNode(node1);
            nodeEditor.addNode(node2);
            nodeEditor.addNode(node3);

            // Main update loop
            function update() {
                nodeEditor.graph.editNode(
                    node1,
                    "label",
                    `Time: ${Math.random()}`,
                );
                nodeEditor.graph.editNode(
                    node3,
                    "label",
                    `Text: ${Math.random()}`,
                );
                nodeEditor.update();
                requestAnimationFrame(update);
            }
            update();
        </script>
    </body>
</html>
