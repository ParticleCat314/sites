<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>SVG Node Example</title>
        <style>
            body {
                background: #1e1e1e;
                margin: 0;
                overflow: hidden;
            }
            svg {
                width: 100vw;
                height: 100vh;
            }
            .node {
                cursor: grab;
                transition: filter 0.2s ease;
            }
            .node:hover {
                filter: brightness(1.2);
            }
            .titlebar {
                fill: #3a7bd5;
            }
            .body {
                fill: #2a2a2a;
                stroke: #444;
                stroke-width: 1.2;
            }
            .label {
                fill: #fff;
                font-family: sans-serif;
                font-size: 12px;
                pointer-events: none;
            }
            .port {
                fill: #888;
                stroke: #333;
                stroke-width: 1;
                cursor: crosshair;
                transition: fill 0.15s;
            }
            .port:hover {
                fill: #3a7bd5;
            }
        </style>
    </head>
    <body>
        <svg id="canvas">
            <defs>
                <filter
                    id="shadow"
                    x="-20%"
                    y="-20%"
                    width="140%"
                    height="140%"
                >
                    <feDropShadow
                        dx="2"
                        dy="3"
                        stdDeviation="3"
                        flood-color="#000"
                        flood-opacity="0.5"
                    />
                </filter>
            </defs>

            <g
                class="node"
                transform="translate(100, 100)"
                filter="url(#shadow)"
            >
                <rect class="body" width="160" height="100" rx="8" ry="8" />
                <rect class="titlebar" width="160" height="25" rx="8" ry="8" />
                <text class="label" x="10" y="17">Math Node</text>
                <!-- Inputs -->
                <circle class="port" cx="0" cy="45" r="5" />
                <circle class="port" cx="0" cy="75" r="5" />
                <!-- Outputs -->
                <circle class="port" cx="160" cy="60" r="5" />
            </g>

            <g
                class="node"
                transform="translate(350, 200)"
                filter="url(#shadow)"
            >
                <rect class="body" width="160" height="80" rx="8" ry="8" />
                <rect
                    class="titlebar"
                    width="160"
                    height="25"
                    rx="8"
                    ry="8"
                    fill="#b33b72"
                />
                <text class="label" x="10" y="17">Display Node</text>
                <circle class="port" cx="0" cy="50" r="5" />
            </g>
        </svg>

        <script>
            const svg = document.getElementById("canvas");
            let selected = null,
                offset = {};

            svg.addEventListener("mousedown", (e) => {
                const node = e.target.closest(".node");
                if (node) {
                    selected = node;
                    const pt = svg.createSVGPoint();
                    pt.x = e.clientX;
                    pt.y = e.clientY;
                    const ctm = node.getCTM().inverse();
                    const local = pt.matrixTransform(ctm);
                    offset.x = local.x;
                    offset.y = local.y;
                }
            });

            svg.addEventListener("mousemove", (e) => {
                if (selected) {
                    const pt = svg.createSVGPoint();
                    pt.x = e.clientX;
                    pt.y = e.clientY;
                    const global = pt.matrixTransform(
                        svg.getScreenCTM().inverse(),
                    );
                    selected.setAttribute(
                        "transform",
                        `translate(${global.x - offset.x}, ${global.y - offset.y})`,
                    );
                }
            });

            svg.addEventListener("mouseup", () => (selected = null));
        </script>
    </body>
</html>
